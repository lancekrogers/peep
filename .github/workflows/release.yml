name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/distribution.yml
    with:
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: peep-distribution
          path: dist
      - name: Assemble checksummed release assets
        run: |
          mkdir assets
          cp dist/*.tar.gz dist/distribution/npm-tarballs/*.tgz assets/
          cp dist/distribution/homebrew/peep.rb dist/distribution/aur/PKGBUILD assets/
          cp dist/distribution/aur/.SRCINFO assets/peep.SRCINFO
          cd assets
          sha256sum -- *.tar.gz *.tgz peep.rb PKGBUILD peep.SRCINFO > checksums.txt
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --verify-tag --title "peep $TAG" --generate-notes
